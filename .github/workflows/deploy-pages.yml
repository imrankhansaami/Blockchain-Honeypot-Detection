name: Deploy dashboard to GitHub Pages

# Publishes the statically-exported Next.js dashboard to GitHub Pages so the
# UI is viewable at:
#   https://<owner>.github.io/<repo>/
#
# Set the repository variable NEXT_PUBLIC_API_BASE (Settings → Secrets and
# variables → Actions → Variables) to your deployed backend URL to make the
# live site fully functional; otherwise the UI loads and shows an API banner.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static export
        run: npm run build
        env:
          # Project sites are served from /<repo>/. Change if you rename the repo.
          NEXT_PUBLIC_BASE_PATH: /Blockchain-Honeypot-Detection
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
